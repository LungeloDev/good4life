<aside class="sidebar">
    <a class="brand" routerLink="/" aria-label="GooD4Life home">
        <span class="brand-mark" aria-hidden="true">G</span>
        <span class="brand-copy">
            <strong>GooD4Life</strong>
            <small>A clearer way forward</small>
        </span>
    </a>

    <span class="nav-label">YOUR OVERVIEW</span>

    <nav aria-label="Main navigation">
        @for (link of links; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="active" ariaCurrentWhenActive="page">
            <span class="nav-icon" aria-hidden="true">{{ link.icon }}</span>
            <span>{{ link.label }}</span>
        </a>
        }
    </nav>

    <div class="encouragement">
        <span aria-hidden="true">✳</span>
        <h2>One step at a time.</h2>
        <p>Bring your debts into focus and work towards your next milestone.</p>
    </div>
    <button class="logout-button" type="button" [disabled]="signingOut()" (click)="logout()">
        {{ signingOut() ? 'Signing out…' : 'Sign out' }}
    </button>

    @if (logoutError()) {
    <p class="logout-error" role="alert">{{ logoutError() }}</p>
    }
    <footer>
        <span class="footer-dot" aria-hidden="true"></span>
        Your journey starts with clarity
    </footer>
</aside>
