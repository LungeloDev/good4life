<section class="empty-state">
    <div class="empty-icon" aria-hidden="true">{{ icon() }}</div>

    <h2>{{ title() }}</h2>
    <p>{{ description() }}</p>

    @if (actionLabel()) {
    <button type="button" (click)="action.emit()">
        {{ actionLabel() }}
        <span aria-hidden="true">→</span>
    </button>
    }
</section>
