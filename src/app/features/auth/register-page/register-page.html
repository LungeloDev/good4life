<app-public-header [showAction]="false" />

<main class="auth-page">
    <section class="auth-card">
        <span class="eyebrow">YOUR JOURNEY STARTS HERE</span>
        <h1>Create your account</h1>
        <p class="intro">Set up your sign-in details, then complete your profile.</p>

        <form #registerForm="ngForm" (ngSubmit)="submit(registerForm)">
            <label class="field">
                <span>Email address</span>
                <input name="email" type="email" [(ngModel)]="email" autocomplete="email" placeholder="name@example.com"
                    email required [disabled]="submitting()" />
            </label>

            <label class="field">
                <span>Password</span>
                <input name="password" type="password" [(ngModel)]="password" autocomplete="new-password"
                    placeholder="At least 6 characters" minlength="6" required [disabled]="submitting()" />
                <small>Firebase may enforce additional password requirements.</small>
            </label>

            <label class="field">
                <span>Confirm password</span>
                <input name="confirmPassword" type="password" [(ngModel)]="confirmPassword" autocomplete="new-password"
                    placeholder="Re-enter your password" required [disabled]="submitting()" />
            </label>

            @if (error()) {
            <p class="error" role="alert">{{ error() }}</p>
            }

            <button class="submit-button" type="submit" [disabled]="registerForm.invalid || submitting()">
                {{ submitting() ? 'Creating account…' : 'Create account' }}
            </button>
        </form>

        <p class="switch-page">
            Already have an account?
            <a routerLink="/login">Sign in</a>
        </p>
    </section>
</main>
