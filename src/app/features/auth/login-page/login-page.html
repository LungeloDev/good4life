<app-public-header [showAction]="false" />

<main class="auth-page">
    <section class="auth-card">
        <span class="eyebrow">WELCOME BACK</span>
        <h1>Sign in to GooD4Life</h1>
        <p class="intro">Continue your journey towards a clearer financial picture.</p>

        <form #loginForm="ngForm" (ngSubmit)="submit(loginForm)">
            <label class="field">
                <span>Email address</span>
                <input name="email" type="email" [(ngModel)]="email" autocomplete="email" placeholder="name@example.com"
                    email required [disabled]="submitting()" />
            </label>

            <label class="field">
                <span>Password</span>
                <input name="password" type="password" [(ngModel)]="password" autocomplete="current-password"
                    placeholder="Enter your password" required [disabled]="submitting()" />
            </label>

            @if (error()) {
            <p class="error" role="alert">{{ error() }}</p>
            }

            <button class="submit-button" type="submit" [disabled]="loginForm.invalid || submitting()">
                {{ submitting() ? 'Signing in…' : 'Sign in' }}
            </button>
        </form>

        <p class="switch-page">
            New to GooD4Life?
            <a routerLink="/register">Create an account</a>
        </p>
    </section>
</main>
